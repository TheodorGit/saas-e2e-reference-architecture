# The live view's address, answered from the first second of a run: the runner's
# screen once it is up, and a page that waits for it until then (never a bare 502).
# Quiet in the run's output: warnings and errors only, and no request log.
worker_processes 1;
error_log /dev/stderr warn;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7900;
        # A refused connection only means "not up yet": not worth a line.
        error_log /dev/stderr crit;

        location / {
            # The runner shares the app's network, so its viewer is at demo-esp:7900.
            proxy_pass http://demo-esp:7900;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # The viewer's connection can stay quiet while the screen does not change.
            proxy_read_timeout 1h;
            error_page 502 504 = /starting.html;
        }

        location = /starting.html {
            root /usr/share/nginx/live;
            add_header Cache-Control "no-store";
        }
    }
}
