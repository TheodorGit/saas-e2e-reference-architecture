# The live view on 7900: the runner's viewer, or starting.html until it is up.
worker_processes 1;
error_log /dev/stderr warn;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7900;
        # Refused connections are expected until the viewer starts.
        error_log /dev/stderr crit;

        location / {
            # The runner shares the app's network, so its viewer is at demo-esp:7900.
            proxy_pass http://demo-esp:7900;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # The viewer can be idle while the screen does not change.
            proxy_read_timeout 1h;
            error_page 502 504 = /starting.html;
        }

        location = /starting.html {
            root /usr/share/nginx/live;
            add_header Cache-Control "no-store";
        }
    }
}
