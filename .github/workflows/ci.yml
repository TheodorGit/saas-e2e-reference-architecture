name: ci

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  framework:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025
          - 1025:1025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # Mailpit lets the live adapter test run.
      - run: pytest framework/tests -rs

  example-clean:
    needs: framework
    runs-on: ubuntu-latest
    env:
      E2E_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: docker compose up --build --exit-code-from tests
      # The test runner writes as root; give the reports back to this job's user.
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" reports
      - run: python scripts/check_flag_run.py reports
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-clean
          path: reports/*-clean/

  flags:
    needs: framework
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.matrix.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: >-
          echo "list=$(python -c 'import json, example.suite.bug_matrix as m;
          print(json.dumps(sorted(m.GUARDS)))')" >> "$GITHUB_OUTPUT"

  example-bug:
    needs: [example-clean, flags]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flag: ${{ fromJSON(needs.flags.outputs.list) }}
    env:
      DEMO_ESP_BUGS: ${{ matrix.flag }}
      E2E_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: run the suite against the defect (expected to fail)
        run: |
          set +e
          docker compose up --build --exit-code-from tests
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::the suite passed with ${DEMO_ESP_BUGS} injected"
            exit 1
          fi
      # The test runner writes as root; give the reports back to this job's user.
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" reports
      - run: python scripts/check_flag_run.py reports --flag "${DEMO_ESP_BUGS}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.flag }}
          path: reports/*-${{ matrix.flag }}/

  # Needs Settings > Pages > Source: GitHub Actions.
  pages:
    needs: [example-clean, example-bug]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Each artifact holds its run folder, so both land in reports/.
      - uses: actions/download-artifact@v8
        with:
          name: report-clean
          path: reports
      - uses: actions/download-artifact@v8
        with:
          name: report-suppression_leak
          path: reports
      - run: python scripts/build_site.py --reports reports --red suppression_leak --out site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
